name: qrtable-provider

networks:
  qrtable-nw:
    driver: bridge
    name: qrtable-nw
services:
  mongodb:
    image: mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    networks:
      - qrtable-nw
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./docker/docker_data/mongodb_data:/data/db

  postgres:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qrtable
    ports:
      - '5432:5432'
    networks:
      - qrtable-nw
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d qrtable']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./docker/docker_data/postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qrtable-nw
    volumes:
      - ./docker/docker_data/pgadmin_data:/var/lib/pgadmin

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    ports:
      - '8180:8080'
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'

    command:
      - start-dev
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'bash -lc ": > /dev/tcp/127.0.0.1/9000"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - ./docker/docker_data/keycloak_data:/opt/keycloak/data
      - ./apps/keycloak-theme/dist_keycloak:/opt/keycloak/providers
    networks:
      - qrtable-nw

  redis:
    image: redis
    ports:
      - '6379:6379'
    networks:
      - qrtable-nw
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./docker/docker_data/redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - '5540:5540'
    networks:
      - qrtable-nw
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./docker/docker_data/redisinsight_data:/data
