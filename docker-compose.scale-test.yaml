      kafka:
        condition: service_healthy
      order-a:
        condition: service_healthy
      saas:
        condition: service_healthy
    networks:
      - qrtable-data
      - scale-test-host
    environment:
      NODE_ENV: development
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api/v1}
      PORT: 3300
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL: 1800000
      KAFKA_BROKERS: kafka:9092
      KAFKA_BFF_CLIENT_ID: qrtable-scale-test-bff-b
      KAFKA_BFF_CONSUMER_GROUP: qrtable-scale-test-bff-bridge
      TCP_AUTHORIZER_SERVICE_HOST: authorizer
      TCP_AUTHORIZER_SERVICE_PORT: 3204
      TCP_CATALOG_SERVICE_HOST: catalog
      TCP_CATALOG_SERVICE_PORT: 3205
      TCP_ORDER_SERVICE_HOST: order-a
      TCP_ORDER_SERVICE_PORT: 3201
      TCP_KITCHEN_SERVICE_HOST: kitchen
      TCP_KITCHEN_SERVICE_PORT: 3207
      TCP_PAYMENT_SERVICE_HOST: payment
      TCP_PAYMENT_SERVICE_PORT: 3208
      TCP_SAAS_SERVICE_HOST: saas
      TCP_SAAS_SERVICE_PORT: 3206
      TCP_USER_ACCESS_SERVICE_HOST: user-access
      TCP_USER_ACCESS_SERVICE_PORT: 3203
      AUTHORIZER_SERVICE_HOST: authorizer
      AUTHORIZER_SERVICE_PORT: 5100
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4300,http://localhost:4302}
      PUBLIC_API_BASE_URL: ${SCALE_TEST_BFF_B_PUBLIC_API_BASE_URL:-http://localhost:4302}
      PLATFORM_CONTACT_EMAIL: support@qrtable.local
      BFF_PAYMENT_TCP_TIMEOUT_MS: 5000
    ports:
      - '${SCALE_TEST_BFF_B_PORT:-4302}:3300'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null "http://127.0.0.1:3300/$$GLOBAL_PREFIX/health/live"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  scale-test-host:
    name: qrtable-scale-test-host
    driver: bridge
