services:
  postgres:
    networks:
      - qrtable-data
      - scale-test-host
    ports:
      - '127.0.0.1:${SCALE_TEST_POSTGRES_HOST_PORT:-15432}:5432'

  redis:
    networks:
      - qrtable-data
      - scale-test-host
    ports:
      - '127.0.0.1:${SCALE_TEST_REDIS_HOST_PORT:-16379}:6379'

  kafka:
    networks:
      - qrtable-data
      - scale-test-host
    ports:
      - '127.0.0.1:${SCALE_TEST_KAFKA_HOST_PORT:-19092}:9092'

  catalog:
    image: ${SCALE_TEST_IMAGE_REPOSITORY:-registry.digitalocean.com/qrtable/qrtable}:catalog-${SCALE_TEST_IMAGE_TAG:-v1.0.0}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - qrtable-data
      - scale-test-host
    environment:
      NODE_ENV: development
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api/v1}
      CATALOG_PORT: 3305
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      TYPEORM_HOST: postgres
      TYPEORM_PORT: 5432
      TYPEORM_USERNAME: ${POSTGRES_USER:-postgres}
      TYPEORM_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TYPEORM_TYPE: postgres
      TYPEORM_SYNCHRONIZE: 'false'
      DATABASE_SHARED_FALLBACK_ENABLED: 'false'
      CATALOG_TYPEORM_DATABASE: ${CATALOG_TYPEORM_DATABASE:-qrtable_catalog}
      TCP_CATALOG_SERVICE_HOST: 0.0.0.0
      TCP_CATALOG_SERVICE_PORT: 3205
      CATALOG_SERVICE_HOST: 0.0.0.0
      TCP_SAAS_SERVICE_HOST: saas
      TCP_SAAS_SERVICE_PORT: 3206
      KAFKA_BROKERS: kafka:9092
      KAFKA_CATALOG_CLIENT_ID: qrtable-scale-test-catalog
      KAFKA_CATALOG_TENANT_CONSUMER_GROUP: qrtable-scale-test-catalog-tenant
    ports:
      - '${SCALE_TEST_CATALOG_HTTP_PORT:-4305}:3305'
      - '${SCALE_TEST_CATALOG_TCP_PORT:-4205}:3205'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null "http://127.0.0.1:3305/$$GLOBAL_PREFIX/health/live"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  saas:
    image: ${SCALE_TEST_IMAGE_REPOSITORY:-registry.digitalocean.com/qrtable/qrtable}:saas-${SCALE_TEST_IMAGE_TAG:-v1.0.0}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - qrtable-data
      - scale-test-host
    environment:
      NODE_ENV: development
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api/v1}
      SAAS_PORT: 3306
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      TYPEORM_HOST: postgres
      TYPEORM_PORT: 5432
      TYPEORM_USERNAME: ${POSTGRES_USER:-postgres}
      TYPEORM_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TYPEORM_TYPE: postgres
      TYPEORM_SYNCHRONIZE: 'false'
      DATABASE_SHARED_FALLBACK_ENABLED: 'false'
      SAAS_TYPEORM_DATABASE: ${SAAS_TYPEORM_DATABASE:-qrtable_saas}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TCP_SAAS_SERVICE_HOST: 0.0.0.0
      TCP_SAAS_SERVICE_PORT: 3206
      SAAS_SERVICE_HOST: 0.0.0.0
      TCP_AUTHORIZER_SERVICE_HOST: authorizer
      TCP_AUTHORIZER_SERVICE_PORT: 3204
      TCP_USER_ACCESS_SERVICE_HOST: user-access
      TCP_USER_ACCESS_SERVICE_PORT: 3203
      TCP_CATALOG_SERVICE_HOST: catalog
      TCP_CATALOG_SERVICE_PORT: 3205
      TCP_ORDER_SERVICE_HOST: order-a
      TCP_ORDER_SERVICE_PORT: 3201
      TCP_PAYMENT_SERVICE_HOST: payment
      TCP_PAYMENT_SERVICE_PORT: 3208
      KAFKA_BROKERS: kafka:9092
      KAFKA_SAAS_CLIENT_ID: qrtable-scale-test-saas
      KAFKA_TENANT_CREATED_TOPIC: tenant.created
    ports:
      - '${SCALE_TEST_SAAS_HTTP_PORT:-4306}:3306'
      - '${SCALE_TEST_SAAS_TCP_PORT:-4206}:3206'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null "http://127.0.0.1:3306/$$GLOBAL_PREFIX/health/live"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  order-a:
    image: ${SCALE_TEST_IMAGE_REPOSITORY:-registry.digitalocean.com/qrtable/qrtable}:order-${SCALE_TEST_IMAGE_TAG:-v1.0.0}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog:
        condition: service_healthy
    networks:
      - qrtable-data
      - scale-test-host
    environment:
      NODE_ENV: development
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api/v1}
      ORDER_PORT: 3301
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      TYPEORM_HOST: postgres
      TYPEORM_PORT: 5432
      TYPEORM_USERNAME: ${POSTGRES_USER:-postgres}
      TYPEORM_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TYPEORM_TYPE: postgres
      TYPEORM_SYNCHRONIZE: 'false'
      DATABASE_SHARED_FALLBACK_ENABLED: 'false'
      ORDER_TYPEORM_DATABASE: ${ORDER_TYPEORM_DATABASE:-qrtable_order}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TCP_ORDER_SERVICE_HOST: 0.0.0.0
      TCP_ORDER_SERVICE_PORT: 3201
      ORDER_SERVICE_HOST: 0.0.0.0
      TCP_CATALOG_SERVICE_HOST: catalog
      TCP_CATALOG_SERVICE_PORT: 3205
      TCP_SAAS_SERVICE_HOST: saas
      TCP_SAAS_SERVICE_PORT: 3206
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: qrtable-scale-test-order-a
      KAFKA_ORDER_PAYMENT_CONSUMER_GROUP: qrtable-scale-test-order-payment
    ports:
      - '${SCALE_TEST_ORDER_A_HTTP_PORT:-4301}:3301'
      - '${SCALE_TEST_ORDER_A_TCP_PORT:-4201}:3201'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null "http://127.0.0.1:3301/$$GLOBAL_PREFIX/health/live"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  order-b:
    image: ${SCALE_TEST_IMAGE_REPOSITORY:-registry.digitalocean.com/qrtable/qrtable}:order-${SCALE_TEST_IMAGE_TAG:-v1.0.0}
    restart: unless-stopped
