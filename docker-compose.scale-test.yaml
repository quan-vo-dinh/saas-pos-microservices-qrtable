      timeout: 5s
      retries: 12
      start_period: 20s

  bff-b:
    image: ${SCALE_TEST_IMAGE_REPOSITORY:-registry.digitalocean.com/qrtable/qrtable}:bff-${SCALE_TEST_IMAGE_TAG:-v1.0.0}
    restart: unless-stopped
    init: true
    depends_on:
      redis:
