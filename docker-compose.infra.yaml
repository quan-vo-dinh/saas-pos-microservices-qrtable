name: qrtable-infra

networks:
  qrtable-data:
    name: qrtable-data
    driver: bridge
    internal: true
  qrtable-identity:
    name: qrtable-identity
    driver: bridge
    internal: true

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  kafka_data:
  keycloak_data:

services:
  postgres:
    image: postgres:16.13
    restart: unless-stopped
    networks:
      - qrtable-data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-qrtable}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  mongodb:
    image: mongo:7.0.31
    restart: unless-stopped
    networks:
      - qrtable-data
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?required}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7.4.9
    restart: unless-stopped
    networks:
      - qrtable-data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:4.3.0
    restart: unless-stopped
    networks:
      - qrtable-data
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?required}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test:
        ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    mem_limit: 1024m
    volumes:
      - kafka_data:/var/lib/kafka/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    restart: unless-stopped
    networks:
      - qrtable-data
      - qrtable-identity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB:-qrtable_keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:?required}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOST:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    command: ['start']
    healthcheck:
      test: ['CMD-SHELL', 'bash -lc ": > /dev/tcp/127.0.0.1/9000"']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 768m
    volumes:
      - keycloak_data:/opt/keycloak/data
